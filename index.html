<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>條碼掃描器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column, like a library checkout slip — scanner on top, result slip, then history log */
:root{
  --bg:#eef1f4; --card:#ffffff; --fg:#17202b; --muted:#5d6876; --line:#d5dbe2;
  --accent:#1f4fa8; --accent-fg:#ffffff; --ok:#1d7a46; --bad:#b4372c; --scan:#e2462f;
  --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --card:#18202a; --fg:#e6ebf1; --muted:#97a3b2; --line:#2b3644;
  --accent:#7ea6f2; --accent-fg:#0c1320; --ok:#5fc78c; --bad:#f08478; --scan:#ff6b54; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --card:#18202a; --fg:#e6ebf1; --muted:#97a3b2; --line:#2b3644;
  --accent:#7ea6f2; --accent-fg:#0c1320; --ok:#5fc78c; --bad:#f08478; --scan:#ff6b54; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
h2{font-size:12px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.12em}

.viewer{position:relative;background:#0b0e12;border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.viewer video,.viewer img{width:100%;height:100%;object-fit:cover;display:block}
.viewer .idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#c5cdd8;padding:20px;text-align:center;font-size:14px}
.bars{display:flex;gap:2px;height:46px;align-items:stretch;opacity:.55}
.bars i{background:#c5cdd8;display:block}
.reticle{position:absolute;left:8%;right:8%;top:32%;bottom:32%;border:2px solid rgba(255,255,255,.85);border-radius:8px;pointer-events:none}
.reticle::after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:var(--scan);box-shadow:0 0 10px var(--scan);animation:sweep 1.6s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-22px)}to{transform:translateY(22px)}}
@media (prefers-reduced-motion:reduce){.reticle::after{animation:none}}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.btn{font:inherit;font-weight:500;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:12px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-align:center}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible,.btn:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.btn input{display:none}
.status{font-size:13px;color:var(--muted);min-height:1.4em;margin:0}
.status.err{color:var(--bad)}

.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);letter-spacing:.06em}
.manual button{min-height:44px;padding:8px 16px}

.slip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.slip .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:999px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.kind{color:var(--accent)}
.example{font-size:12px;color:var(--muted)}
.code{font-family:var(--mono);font-size:clamp(24px,7.5vw,34px);font-weight:600;letter-spacing:.08em;word-break:break-all;margin:0;font-variant-numeric:tabular-nums}
.code .grp{color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
dt{color:var(--muted)} dd{margin:0;font-family:var(--mono);min-width:0;word-break:break-all}
dd.txt{font-family:var(--sans)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:14px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.links a:hover{border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{min-height:40px;padding:8px 14px;font-size:14px}

.hist{display:flex;flex-direction:column;gap:10px}
.hist .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hist li+li{border-top:1px solid var(--line)}
.hist li button{width:100%;border:0;border-radius:0;background:none;justify-content:space-between;min-height:52px;padding:10px 16px}
.hist .c{font-family:var(--mono);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.hist .m{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:14px 16px}
.small{font-size:13px;min-height:36px!important;padding:6px 12px!important}
.note{font-size:13px;color:var(--muted);margin:0}
.camtools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:-6px}
.zoom{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-size:14px;color:var(--muted)}
.zoom input{flex:1;min-width:0;accent-color:var(--accent)}
.zv{font-family:var(--mono);font-size:13px;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
#torch[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
</style>

<div class="wrap">
  <header>
    <h1>條碼掃描器</h1>
    <span class="tag">EAN-13 · EAN-8 · UPC · ISBN</span>
  </header>

  <section aria-label="掃描">
    <div class="viewer" id="viewer">
      <div class="idle" id="idle">
        <div class="bars" aria-hidden="true" id="deco"></div>
        <div>按「即時掃描」開啟鏡頭，或用「拍照辨識」</div>
      </div>
      <video id="video" playsinline muted hidden></video>
      <img id="photo" alt="上傳的照片" hidden>
      <div class="reticle" id="reticle" hidden></div>
    </div>
  </section>

  <div class="camtools" id="camTools" hidden>
    <label class="zoom" id="zoomWrap" for="zoom" hidden>放大 <input type="range" id="zoom" min="1" max="4" step="0.1" value="1"> <span id="zoomVal" class="zv">1.0×</span></label>
    <button type="button" class="small" id="torch" hidden>手電筒</button>
  </div>

  <div class="actions">
    <button class="primary" id="liveBtn" type="button">即時掃描</button>
    <label class="btn" for="file">拍照辨識<input id="file" type="file" accept="image/*" capture="environment"></label>
  </div>
  <p class="status" id="status" role="status"></p>

  <form class="manual" id="manual" autocomplete="off">
    <input id="manualInput" inputmode="numeric" placeholder="或手動輸入條碼數字" aria-label="手動輸入條碼">
    <button type="submit">查詢</button>
  </form>

  <section class="slip" id="slip" aria-live="polite"></section>

  <section class="hist">
    <div class="head">
      <h2>掃描紀錄</h2>
      <div class="row" id="clearRow"></div>
    </div>
    <ul id="histList"></ul>
    <p class="note">紀錄只存在這支手機的瀏覽器裡，不會上傳。</p>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>window.ZXing||document.write('<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"><\/script>')</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const video=$("video"),photo=$("photo"),idle=$("idle"),reticle=$("reticle"),statusEl=$("status");
const HKEY="barcode-history-v1";

// decorative bars in idle screen
(function(){const w=[2,1,3,1,1,2,4,1,2,1,3,2,1,1,2,3,1,2,1,4,1,2,2,1,3,1,1,2];const d=$("deco");w.forEach((x,i)=>{const e=document.createElement("i");e.style.width=x+"px";if(i%2)e.style.background="transparent";d.appendChild(e)});})();

function setStatus(t,err){statusEl.textContent=t||"";statusEl.classList.toggle("err",!!err)}

/* ---------- barcode logic ---------- */
function eanValid(s){
  if(!/^\d+$/.test(s)||![8,12,13].includes(s.length))return false;
  const d=s.split("").map(Number),c=d.pop();let t=0;
  for(let i=d.length-1,k=0;i>=0;i--,k++)t+=d[i]*(k%2===0?3:1);
  return (10-t%10)%10===c;
}
function isbn10to13(s){const b="978"+s.slice(0,9);let t=0;for(let i=0;i<12;i++)t+=(+b[i])*(i%2?3:1);return b+((10-t%10)%10)}
function isbn10valid(s){if(!/^\d{9}[\dX]$/i.test(s))return false;let t=0;for(let i=0;i<10;i++){const v=s[i].toUpperCase()==="X"?10:+s[i];t+=v*(10-i)}return t%11===0}
function to10(s){const b=s.slice(3,12);let t=0;for(let i=0;i<9;i++)t+=(+b[i])*(10-i);const c=(11-t%11)%11;return b+(c===10?"X":c)}

function prefixInfo(s){
  if(s.length===8)return "EAN-8 短條碼";
  if(s.length===12)return "UPC-A（美國／加拿大）";
  const p3=+s.slice(0,3);
  if(/^97(8|9)/.test(s)){
    const g=s.slice(3,6);
    if(/^978(957|986|626)/.test(s))return "書籍 · 台灣出版";
    if(/^9787/.test(s))return "書籍 · 中國大陸出版";
    if(/^9784/.test(s))return "書籍 · 日本出版";
    if(/^97889|^97911/.test(s))return "書籍 · 韓國出版";
    if(/^978962|^978988/.test(s))return "書籍 · 香港出版";
    if(/^9780|^9781/.test(s))return "書籍 · 英語系出版";
    return "書籍";
  }
  if(p3===977)return "期刊（ISSN）";
  if(p3===471)return "台灣";
  if(p3>=450&&p3<=459||p3>=490&&p3<=499)return "日本";
  if(p3>=690&&p3<=699)return "中國大陸";
  if(p3===489)return "香港";
  if(p3===880)return "韓國";
  if(p3>=0&&p3<=139)return "美國／加拿大";
  if(p3>=20&&p3<=29||p3>=200&&p3<=299)return "店內自編碼";
  if(p3>=885&&p3<=885)return "泰國";
  if(p3>=955&&p3<=955)return "馬來西亞";
  if(p3===888)return "新加坡";
  if(p3>=400&&p3<=440)return "德國";
  if(p3>=300&&p3<=379)return "法國";
  if(p3>=500&&p3<=509)return "英國";
  if(p3===930||p3>=931&&p3<=939)return "澳洲";
  return "其他地區";
}

function analyse(raw){
  let s=String(raw).replace(/[\s-]/g,"");
  let note="";
  if(/^\d{9}[\dX]$/i.test(s)&&!/^\d{10}$/.test(s)||(s.length===10&&isbn10valid(s))){
    if(isbn10valid(s)){note="由 ISBN-10 轉換";s=isbn10to13(s.toUpperCase())}
  }
  const valid=eanValid(s);
  const isbn=valid&&s.length===13&&/^97[89]/.test(s);
  const issn=valid&&s.length===13&&/^977/.test(s);
  return {code:s,valid,isbn,issn,isbn10:isbn&&s.startsWith("978")?to10(s):"",region:valid?prefixInfo(s):"",note};
}

function grouped(s){
  if(s.length===13)return `<span>${s[0]}</span> <span class="grp">${s.slice(1,7)}</span> <span>${s.slice(7)}</span>`;
  return s;
}

function renderResult(r,isExample){
  const slip=$("slip");
  const kind=r.isbn?"ISBN 書籍":r.issn?"ISSN 期刊":r.code.length===8?"EAN-8":r.code.length===12?"UPC-A":"EAN-13";
  let links="";
  if(r.isbn){
    links=`<a href="https://search.books.com.tw/search/query/key/${r.code}" target="_blank" rel="noopener">博客來</a>
      <a href="https://www.google.com/search?tbm=bks&q=isbn:${r.code}" target="_blank" rel="noopener">Google 圖書</a>
      <a href="https://openlibrary.org/isbn/${r.code}" target="_blank" rel="noopener">Open Library</a>
      <a href="https://isbn.ncl.edu.tw/NEW_ISBNNet/" target="_blank" rel="noopener">國圖 ISBN 系統</a>`;
  }else if(r.valid){
    links=`<a href="https://www.google.com/search?q=${r.code}" target="_blank" rel="noopener">Google 搜尋</a>
      <a href="https://world.openfoodfacts.org/product/${r.code}" target="_blank" rel="noopener">Open Food Facts</a>`;
  }
  slip.innerHTML=`
    <div class="top">
      <div class="row">
        <span class="pill kind">${kind}</span>
        <span class="pill ${r.valid?"ok":"bad"}">${r.valid?"檢查碼正確":"檢查碼不符"}</span>
      </div>
      ${isExample?'<span class="example">範例，掃描後會換成你的結果</span>':""}
    </div>
    <p class="code">${r.valid?grouped(r.code):escapeHtml(r.code)}</p>
    <dl>
      ${r.isbn?`<dt>ISBN-13</dt><dd>${r.code}</dd>`:""}
      ${r.isbn10?`<dt>ISBN-10</dt><dd>${r.isbn10}</dd>`:""}
      ${r.issn?`<dt>ISSN</dt><dd>${r.code.slice(3,7)}-${r.code.slice(7,10)}…</dd>`:""}
      ${r.region?`<dt>前綴</dt><dd class="txt">${r.code.slice(0,3)} · ${r.region}</dd>`:""}
      ${r.note?`<dt>備註</dt><dd class="txt">${r.note}</dd>`:""}
      ${!r.valid?`<dt>說明</dt><dd class="txt">不是有效的 EAN／UPC／ISBN。請確認位數（8、12、13 碼）或重掃一次。</dd>`:""}
    </dl>
    ${links?`<div class="links">${links}</div>`:""}
    <div class="row"><button type="button" id="copyBtn">複製號碼</button></div>`;
  $("copyBtn").onclick=async()=>{
    try{await navigator.clipboard.writeText(r.code);setStatus("已複製 "+r.code)}
    catch(e){const el=slip.querySelector(".code");const rg=document.createRange();rg.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(rg);setStatus("已選取號碼，請長按複製")}
  };
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- history ---------- */
function loadHist(){try{return JSON.parse(localStorage.getItem(HKEY)||"[]")}catch(e){return []}}
function saveHist(h){try{localStorage.setItem(HKEY,JSON.stringify(h.slice(0,50)))}catch(e){}}
let history=loadHist();
function addHist(r){history=history.filter(x=>x.code!==r.code);history.unshift({code:r.code,t:Date.now()});saveHist(history);renderHist()}
function renderHist(){
  const ul=$("histList");ul.innerHTML="";
  if(!history.length){ul.innerHTML='<li class="empty">還沒有紀錄。掃到的條碼會依時間列在這裡。</li>';$("clearRow").innerHTML="";return}
  history.forEach(h=>{
    const r=analyse(h.code);const li=document.createElement("li");const b=document.createElement("button");b.type="button";
    const d=new Date(h.t);const ts=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    b.innerHTML=`<span class="c">${r.code}</span><span class="m">${r.isbn?"ISBN · ":""}${ts}</span>`;
    b.onclick=()=>{renderResult(r);window.scrollTo({top:$("slip").offsetTop-12,behavior:"smooth"})};
    li.appendChild(b);ul.appendChild(li);
  });
  const cr=$("clearRow");cr.innerHTML='<button type="button" class="small" id="clr">清除</button>';
  $("clr").onclick=()=>{cr.innerHTML='<button type="button" class="small" id="clrYes">確定清除全部</button><button type="button" class="small" id="clrNo">取消</button>';
    $("clrYes").onclick=()=>{history=[];saveHist(history);renderHist()};$("clrNo").onclick=renderHist;};
}

function accept(text,src){
  const r=analyse(text);renderResult(r);
  if(r.valid){addHist(r);if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){}}
  setStatus((src?src+"：":"")+(r.valid?"讀到 "+r.code:"讀到的號碼檢查碼不符"),!r.valid);
}

/* ---------- decoding ---------- */
const Z=window.ZXing;
let zReader=null;
if(Z){
  const hints=new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
  hints.set(Z.DecodeHintType.TRY_HARDER,true);
  zReader=new Z.MultiFormatReader();zReader.setHints(hints);
}
let native=null;
if("BarcodeDetector" in window){
  try{BarcodeDetector.getSupportedFormats().then(f=>{const want=["ean_13","ean_8","upc_a","upc_e"].filter(x=>f.includes(x));if(want.length)native=new BarcodeDetector({formats:want})}).catch(()=>{})}catch(e){}
}
const work=document.createElement("canvas");const wctx=work.getContext("2d",{willReadFrequently:true});

function zxingCanvas(c){
  if(!zReader)return null;
  const {width:w,height:h}=c;const px=c.getContext("2d",{willReadFrequently:true}).getImageData(0,0,w,h).data;
  const L=new Uint8ClampedArray(w*h);
  for(let i=0,j=0;i<L.length;i++,j+=4)L[i]=(px[j]*77+px[j+1]*150+px[j+2]*29)>>8;
  try{return zReader.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(L,w,h)))).getText()}
  catch(e){return null}finally{try{zReader.reset()}catch(e){}}
}
function drawTo(src,sw,sh,maxW,rot){
  const scale=Math.min(1,maxW/Math.max(sw,sh));const w=Math.round(sw*scale),h=Math.round(sh*scale);
  if(rot){work.width=h;work.height=w;wctx.save();wctx.translate(h,0);wctx.rotate(Math.PI/2);wctx.drawImage(src,0,0,w,h);wctx.restore()}
  else{work.width=w;work.height=h;wctx.drawImage(src,0,0,w,h)}
  return work;
}
async function decodeImage(img){
  const sw=img.naturalWidth,sh=img.naturalHeight;
  if(native){try{const r=await native.detect(img);if(r&&r[0])return r[0].rawValue}catch(e){}}
  for(const size of [1600,1000,2400,700]){for(const rot of [false,true]){
    const t=zxingCanvas(drawTo(img,sw,sh,size,rot));if(t)return t;
    await new Promise(r=>setTimeout(r,0));
  }}
  return null;
}

/* ---------- photo mode ---------- */
$("file").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  stopLive();
  const url=URL.createObjectURL(f);
  photo.onload=async()=>{
    idle.hidden=true;photo.hidden=false;video.hidden=true;reticle.hidden=true;
    setStatus("辨識中…");
    const t=await decodeImage(photo);
    if(t)accept(t,"照片");
    else setStatus("這張照片找不到條碼。請讓條碼佔畫面寬度一半以上、對焦清楚、避免反光後再拍一次。",true);
    e.target.value="";
  };
  photo.onerror=()=>setStatus("無法讀取這張圖片，請換一張試試。",true);
  photo.src=url;
});

/* ---------- live mode ---------- */
let stream=null,track=null,running=false,busy=false,lastTry=0,frames=0;
const engineName=()=>native?"系統內建＋ZXing":(Z?"ZXing":"無辨識元件");
async function startLive(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("這個瀏覽器不支援即時相機，請用「拍照辨識」。",true);return}
  const base={facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}};
  try{
    try{stream=await navigator.mediaDevices.getUserMedia({video:Object.assign({},base,{advanced:[{focusMode:"continuous"}]}),audio:false})}
    catch(e1){if(e1&&e1.name==="NotAllowedError")throw e1;stream=await navigator.mediaDevices.getUserMedia({video:base,audio:false})}
  }catch(err){
    setStatus(err&&err.name==="NotAllowedError"
      ?"無法開啟相機：權限被拒絕，或這個頁面所在的環境不允許使用相機。請到瀏覽器設定允許相機，或改用「拍照辨識」。"
      :"無法開啟相機（"+(err&&err.name||"未知錯誤")+"）。請改用「拍照辨識」。",true);
    return;
  }
  track=stream.getVideoTracks()[0];
  video.srcObject=stream;try{await video.play()}catch(e){}
  idle.hidden=true;photo.hidden=true;video.hidden=false;reticle.hidden=false;
  setupTools();
  $("liveBtn").textContent="停止掃描";running=true;busy=false;frames=0;
  setStatus("把條碼放進框內，手機離條碼約 15–25 公分，等畫面清楚對焦");
  requestAnimationFrame(loop);
}
function setupTools(){
  let caps={};try{caps=track&&track.getCapabilities?track.getCapabilities():{}}catch(e){}
  const zr=$("zoom");let any=false;
  if(caps.zoom&&caps.zoom.max>caps.zoom.min){
    zr.min=caps.zoom.min;zr.max=Math.min(caps.zoom.max,8);zr.step=caps.zoom.step||0.1;
    const start=Math.min(Math.max(2,caps.zoom.min),+zr.max);
    zr.value=start;applyZoom(start);$("zoomWrap").hidden=false;any=true;
  }else $("zoomWrap").hidden=true;
  const tb=$("torch");tb.setAttribute("aria-pressed","false");
  if(caps.torch){tb.hidden=false;any=true}else tb.hidden=true;
  $("camTools").hidden=!any;
}
function applyZoom(v){
  $("zoomVal").textContent=(+v).toFixed(1)+"×";
  if(track)track.applyConstraints({advanced:[{zoom:+v}]}).catch(()=>{});
}
$("zoom").addEventListener("input",e=>applyZoom(e.target.value));
$("torch").addEventListener("click",()=>{
  const tb=$("torch");const on=tb.getAttribute("aria-pressed")!=="true";
  if(track)track.applyConstraints({advanced:[{torch:on}]}).then(()=>tb.setAttribute("aria-pressed",String(on))).catch(()=>setStatus("這支手機不讓網頁控制手電筒。",true));
});
function stopLive(){
  running=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  track=null;video.srcObject=null;video.hidden=true;reticle.hidden=true;$("camTools").hidden=true;
  if(photo.hidden)idle.hidden=false;
  $("liveBtn").textContent="即時掃描";
}
async function scanFrame(n){
  const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return null;
  if(native){try{const r=await native.detect(video);if(r&&r[0])return r[0].rawValue}catch(e){}}
  if(!Z)return null;
  const mode=n%3;
  if(mode===0){
    // middle band where the frame is drawn
    const cw=Math.round(vw*0.92),ch=Math.round(vh*0.5),cx=Math.round((vw-cw)/2),cy=Math.round((vh-ch)/2);
    const s=Math.min(1,1280/cw);work.width=Math.round(cw*s);work.height=Math.round(ch*s);
    wctx.drawImage(video,cx,cy,cw,ch,0,0,work.width,work.height);
  }else drawTo(video,vw,vh,1280,mode===2); // whole frame, and rotated for vertical barcodes
  return zxingCanvas(work);
}
async function loop(ts){
  if(!running)return;
  if(!busy&&ts-lastTry>110&&video.readyState>=2){
    busy=true;lastTry=ts;frames++;
    let t=null;try{t=await scanFrame(frames)}catch(e){}
    busy=false;
    if(!running)return;
    if(t){const d=String(t).replace(/\D/g,"");if(eanValid(d)){accept(d,"即時");stopLive();return}}
    if(frames%15===0)setStatus(`掃描中…已分析 ${frames} 張畫面（${engineName()}，${video.videoWidth}×${video.videoHeight}）。畫面模糊的話，把手機拉遠一點或調大「放大」。`);
  }
  requestAnimationFrame(loop);
}
$("liveBtn").addEventListener("click",()=>running?stopLive():startLive());
document.addEventListener("visibilitychange",()=>{if(document.hidden&&running)stopLive()});

/* ---------- manual ---------- */
$("manual").addEventListener("submit",e=>{
  e.preventDefault();const v=$("manualInput").value.trim();if(!v)return;
  accept(v,"手動");$("manualInput").value="";
});

if(!Z)setStatus("辨識元件載入失敗，請檢查網路後重新整理。拍照辨識暫時無法使用。",true);
